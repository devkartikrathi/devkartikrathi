<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="76" viewBox="0 0 1200 76" role="img" aria-label="End of record"><title>End of record</title><style>@font-face{font-family:hl-mono;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}
.fu{animation:fu .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fi{animation:fi 1.1s ease both}
@keyframes fi{from{opacity:0}to{opacity:1}}
.dr{stroke-dasharray:1;stroke-dashoffset:0;animation:dr 1.6s cubic-bezier(.65,0,.35,1) both}
@keyframes dr{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.blink{animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{opacity:.7;transform:scale(1)}80%,100%{opacity:0;transform:scale(3.2)}}
text{font-kerning:normal}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><line x1="0" y1="20.5" x2="1200" y2="20.5" stroke="#30363D" stroke-width="1" pathLength="1" class="dr" style="" /><line x1="960" y1="20.5" x2="1200" y2="20.5" stroke="#FF6B3D" stroke-width="2" pathLength="1" class="dr" style="animation-delay:0.50s;" /><text x="0.0" y="56.0" fill="#8B949E" text-anchor="start" style="font-family:hl-mono,ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:13px;letter-spacing:1.8px;" class="fi">END OF RECORD  ·  KARTIK RATHI  ·  NEW DELHI</text><text x="1200.0" y="56.0" fill="#8B949E" text-anchor="end" style="font-family:hl-mono,ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:13px;letter-spacing:1.8px;" class="fi">SET IN INSTRUMENT SERIF, INTER &amp; JETBRAINS MONO</text></svg>