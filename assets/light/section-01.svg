<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="92" viewBox="0 0 1200 92" role="img" aria-label="§01 Index"><title>§01 Index</title><style>@font-face{font-family:hl-monom;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:hl-serif;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:hl-mono;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}
.fu{animation:fu .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fi{animation:fi 1.1s ease both}
@keyframes fi{from{opacity:0}to{opacity:1}}
.dr{stroke-dasharray:1;stroke-dashoffset:0;animation:dr 1.6s cubic-bezier(.65,0,.35,1) both}
@keyframes dr{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.blink{animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{opacity:.7;transform:scale(1)}80%,100%{opacity:0;transform:scale(3.2)}}
text{font-kerning:normal}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><text x="2.0" y="60.0" fill="#E4461B" text-anchor="start" style="font-family:hl-monom,ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:15px;letter-spacing:1.5px;" class="fi">§ 01</text><text x="74.0" y="64.0" fill="#1B1A17" text-anchor="start" style="font-family:hl-serif,'Iowan Old Style',Georgia,serif;font-size:54px;letter-spacing:-0.5px;" class="fu">Index</text><circle cx="203.464" cy="50.5" r="3" fill="#E4461B" stroke="none" stroke-width="1" class="fi" style="animation-delay:0.30s;" /><line x1="213.464" y1="50.5" x2="1094.2" y2="50.5" stroke="#D1D9E0" stroke-width="1" pathLength="1" class="dr" style="animation-delay:0.25s;" /><line x1="1094.7" y1="43" x2="1094.7" y2="58" stroke="#59636E" stroke-width="1" class="fi" style="animation-delay:1.20s;" /><text x="1199.0" y="55.0" fill="#59636E" text-anchor="end" style="font-family:hl-mono,ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:14px;letter-spacing:1.8px;animation-delay:0.80s;" class="fi">WHO I AM</text></svg>